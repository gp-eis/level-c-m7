<!doctype html>
<html lang="en-US" translate="no">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Monkey, the Copycat Activity — Animals</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/reading-week-3-activity.css?v=20260830-2">
</head>
<body>
  <div class="floaties" aria-hidden="true">
    <span style="top:11%;left:3%">🌿</span>
    <span style="top:72%;left:94%">🐒</span>
  </div>

  <main class="page reading-qa-page">
    <a class="back-link" href="week-3.html">⬅️ Monkey, the Copycat</a>

    <header class="reading-qa-header">
      <h1 class="big-title page-title-with-icon">
        <span class="reading-qa-title-icon" aria-hidden="true">📚</span>
        Jungle Story Challenge
      </h1>
      <div class="reading-qa-intro">
        <p class="subtitle">Listen carefully, then choose the best picture!</p>
        <button class="reading-qa-speaker reading-qa-intro-speaker" id="reading-qa-intro-speaker" type="button" aria-label="Listen to the activity instructions">🔊</button>
      </div>
    </header>

    <section class="reading-qa-board" aria-labelledby="reading-qa-question">
      <div class="reading-qa-progress">
        <span id="reading-qa-progress-label">Question 1 of 4</span>
        <span class="reading-qa-progress-dots" id="reading-qa-progress-dots" aria-hidden="true"></span>
      </div>

      <div class="reading-qa-question-panel">
        <div class="reading-qa-question-copy">
          <span class="reading-qa-question-kicker" id="reading-qa-question-kicker">Story Question</span>
          <h2 id="reading-qa-question"></h2>
        </div>
        <button class="reading-qa-speaker" id="reading-qa-question-speaker" type="button" aria-label="Listen to the question">🔊</button>
      </div>

      <div class="reading-qa-answers" id="reading-qa-answers"></div>
      <p class="reading-qa-feedback" id="reading-qa-feedback" aria-live="polite"></p>
    </section>
  </main>

  <div class="reading-qa-completion" id="reading-qa-completion" role="dialog" aria-modal="true" aria-labelledby="reading-qa-completion-title" hidden>
    <section class="reading-qa-completion-card">
      <div class="reading-qa-completion-icon" aria-hidden="true">🌟🐒🌟</div>
      <h2 id="reading-qa-completion-title">Great job!</h2>
      <p>You finished the Monkey, the Copycat activity!</p>
      <div class="reading-qa-completion-actions">
        <button class="reading-qa-speaker" id="reading-qa-completion-speaker" type="button" aria-label="Listen to the congratulations message">🔊</button>
        <button class="pill-btn green" id="reading-qa-try-again" type="button">🔄 Try Again</button>
        <a class="pill-btn blue" href="week-3.html">🎬 Back to Reading</a>
      </div>
    </section>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/reading-week-3-activity.js"></script>
</body>
</html>
