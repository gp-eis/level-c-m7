<!doctype html>
<html lang="en-US" translate="no">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bird Watcher Challenge — Reading Week 4</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/reading-week-4-activity.css?v=20260830">
</head>
<body class="reading-quiz-page">
  <div class="floaties" aria-hidden="true">
    <span style="top:12%;left:4%">🐦</span>
    <span style="top:72%;left:94%">🕸️</span>
  </div>

  <main class="page reading-quiz-shell">
    <a class="back-link" href="week-4.html">⬅️ Week 4 Reading</a>

    <header class="reading-quiz-header">
      <h1 class="big-title page-title-with-icon">
        <img class="page-title-icon" src="../assets/images/ui/week-home/reading-penny.png" alt="">
        Bird Watcher Challenge
      </h1>
      <div class="reading-quiz-intro">
        <p class="subtitle">Listen carefully, then choose the right picture!</p>
        <button class="reading-speaker reading-speaker-small" id="intro-speaker" type="button" aria-label="Listen to the activity instructions">🔊</button>
      </div>
    </header>

    <section class="reading-quiz-board" aria-labelledby="question-text">
      <div class="reading-quiz-progress">
        <span id="progress-label">Question 1 of 4</span>
        <span class="reading-progress-dots" id="progress-dots" aria-hidden="true"></span>
      </div>

      <div class="reading-question-panel">
        <div class="reading-question-copy">
          <h2 id="question-text"></h2>
          <p class="reading-question-detail" id="question-detail" hidden></p>
        </div>
        <button class="reading-speaker" id="question-speaker" type="button" aria-label="Listen to the question">🔊</button>
      </div>

      <div class="reading-answer-grid" id="answer-grid"></div>
      <p class="reading-feedback" id="feedback" aria-live="polite"></p>
    </section>
  </main>

  <div class="reading-completion" id="completion" role="dialog" aria-modal="true" aria-labelledby="completion-title" hidden>
    <div class="reading-completion-card">
      <div class="reading-completion-icon" aria-hidden="true">🐦✨</div>
      <h2 id="completion-title">Great job!</h2>
      <p>You finished the Bird Watcher Challenge!</p>
      <div class="reading-completion-actions">
        <button class="reading-speaker" id="completion-speaker" type="button" aria-label="Listen to the congratulations message">🔊</button>
        <button class="pill-btn green" id="try-again" type="button">🔄 Try Again</button>
        <a class="pill-btn blue" href="week-4.html">🎬 Back to Reading</a>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/reading-week-4-activity.js"></script>
</body>
</html>
