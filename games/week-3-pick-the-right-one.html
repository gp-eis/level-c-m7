<!doctype html>
<html lang="en-US" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Pick the Right One — Week 3 — In the Jungle</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/games-week-1.css">
  <link rel="stylesheet" href="../css/games-week-3.css">
</head>
<body class="lesson-page">
  <main class="page dog-game-page jungle-game-page pick-right-page">
    <a class="back-link" href="index.html?week=3">⬅️ All Games</a>

    <header class="game-header">
      <h1 class="big-title page-title-with-icon"><img class="page-title-icon" src="../assets/images/ui/game-pick.webp" alt="">Pick the Right One</h1>
      <p class="subtitle">Look at the jungle picture and choose on or behind!</p>
    </header>

    <div class="game-toolbar">
      <button class="pill-btn orange" id="pick-right-new" type="button">🔄 New Round</button>
      <span class="game-score">Correct: <span id="pick-right-score">0</span> / 8</span>
      <span class="game-score">Picture: <span id="pick-right-progress">1</span> / 8</span>
    </div>

    <section class="pick-right-board" aria-labelledby="pick-right-question">
      <div class="pick-right-prompt-row">
        <h2 id="pick-right-question">Where is the animal?</h2>
        <button class="game-listen-btn" id="pick-right-listen" type="button" aria-label="Listen to the question">🔊</button>
      </div>

      <p class="pick-right-phrase" id="pick-right-phrase"></p>

      <div class="pick-right-picture-shell">
        <img id="pick-right-picture" src="" alt="" draggable="false">
      </div>

      <div class="pick-right-choices" id="pick-right-choices" role="group" aria-label="Choose on or behind">
        <button class="pick-right-choice pick-right-choice--grammar" type="button" data-choice="on">
          <span class="pick-right-choice__label">on</span>
        </button>
        <button class="pick-right-choice pick-right-choice--grammar pick-right-choice--alternate" type="button" data-choice="behind">
          <span class="pick-right-choice__label">behind</span>
        </button>
      </div>

      <p class="pick-right-feedback" id="pick-right-feedback" aria-live="polite">Choose on or behind.</p>
      <button class="pill-btn green pick-right-next" id="pick-right-next" type="button" hidden>Next Picture ➡️</button>
    </section>
  </main>

  <div class="game-modal game-celebration" id="pick-right-celebration" role="dialog" aria-modal="true" aria-labelledby="pick-right-celebration-title" hidden>
    <div class="game-modal__card">
      <div class="game-celebration__emoji" aria-hidden="true">🌿🏆🌿</div>
      <h2 id="pick-right-celebration-title">You finished the round!</h2>
      <p class="game-modal__sentence">Wonderful! You know where the jungle animals are.</p>
      <button class="pill-btn green" id="pick-right-play-again" type="button">🔄 Play Again</button>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/week-3-games-data.js"></script>
  <script src="../js/week-3-pick-right-data.js"></script>
  <script src="../js/week-1-pick-right.js"></script>
</body>
</html>
