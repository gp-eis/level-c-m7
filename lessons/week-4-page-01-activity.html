<!doctype html>
<html lang="en-US" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>In the Cave Activity — Literacy Week 4</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="lesson-page literacy-reading-activity-page" data-week="4" data-page="1">
  <main class="page level-c-literacy-quiz-page">
    <a class="back-link" href="week-4-page-01.html#lesson-focus">⬅️ Back to Video</a>

    <header class="literacy-quiz-header">
      <h1 class="big-title">In the Cave Challenge</h1>
      <p class="subtitle">Listen to the sentence and choose the matching picture!</p>
    </header>

    <section class="literacy-quiz-board" aria-labelledby="quiz-question">
      <div class="literacy-quiz-progress" aria-label="Activity progress">
        <span id="quiz-progress-label">Question 1 of 8 · Score 0</span>
        <span class="literacy-progress-dots" id="quiz-progress-dots" aria-hidden="true"></span>
      </div>

      <div class="literacy-question-card">
        <div class="literacy-question-visual" id="quiz-question-visual" data-base-class="literacy-question-visual" role="img" aria-label="Listen for the clue">👂</div>
        <div class="literacy-question-copy">
          <h2 id="quiz-question">Where are they going?</h2>
          <p id="quiz-question-detail">Come with me into the cave.</p>
        </div>
        <button class="literacy-listen-button" id="quiz-listen" type="button" aria-label="Listen to the question and sentence">🔊</button>
      </div>

      <div class="literacy-answer-grid" id="quiz-answers"></div>
      <p class="literacy-quiz-feedback" id="quiz-feedback" aria-live="polite"></p>

      <div class="literacy-quiz-complete" id="quiz-complete" hidden>
        <div class="literacy-complete-icon" aria-hidden="true">🏆</div>
        <h2>Great job!</h2>
        <p>You matched all eight things from the cave!</p>
        <div class="literacy-complete-actions">
          <button class="pill-btn green" id="quiz-restart" type="button">🔄 Try Again</button>
          <a class="pill-btn blue" href="week-4-page-01.html#lesson-focus">🎬 Back to Video</a>
          <a class="pill-btn orange" href="week-4-page-02.html#lesson-focus">Next Page ➡️</a>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/main.js"></script>
  <script src="../js/literacy-reading-activity-week-4.js"></script>
  <script src="../js/literacy-good-job.js"></script>
</body>
</html>
